- name: Deploy Node.js App to EC2 with Nginx
  hosts: webservers
  become: yes

  tasks:
    - name: Install Node.js and npm
      apt:
        name: [nodejs, npm]
        state: present
        update_cache: yes

    - name: Create app directory
      file:
        path: /home/ubuntu/nodeapp
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copy app files
      copy:
        src: ../
        dest: /home/ubuntu/nodeapp/
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Install app dependencies
      shell: |
        cd /home/ubuntu/nodeapp
        npm install
      args:
        executable: /bin/bash

    - name: Create systemd service file for Node.js app
      copy:
        dest: /etc/systemd/system/nodeapp.service
        content: |
          [Unit]
          Description=Node.js App
          After=network.target

          [Service]
          ExecStart=/usr/bin/node /home/ubuntu/nodeapp/app.js
          WorkingDirectory=/home/ubuntu/nodeapp
          Restart=always
          User=root
          Environment=NODE_ENV=production

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd and (re)start Node.js service
      systemd:
        name: nodeapp
        daemon_reload: yes
        enabled: yes
        state: restarted
