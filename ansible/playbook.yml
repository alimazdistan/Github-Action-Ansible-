- name: Deploy Node.js App to EC2
  hosts: webservers
  become: yes

  tasks:
    - name: Install Node.js and npm
      apt:
        name: [nodejs, npm]
        state: present
        update_cache: yes

    - name: Create app directory
      file:
        path: /home/ubuntu/nodeapp
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Check if a previous release exists
      stat:
        path: /home/ubuntu/nodeapp/app.js
      register: existing_release

    - name: Backup current release
      copy:
        src: /home/ubuntu/nodeapp/
        dest: /home/ubuntu/nodeapp_backup/
        remote_src: yes
      when: existing_release.stat.exists

    - name: Copy app files
      copy:
        src: ../
        dest: /home/ubuntu/nodeapp/
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Install app dependencies
      shell: |
        cd /home/ubuntu/nodeapp
        npm install
      args:
        executable: /bin/bash
      register: install_result
      failed_when: install_result.rc != 0

    - name: Create systemd service file for Node.js app
      copy:
        dest: /etc/systemd/system/nodeapp.service
        content: |
          [Unit]
          Description=Node.js App
          After=network.target

          [Service]
          ExecStart=/usr/bin/node /home/ubuntu/nodeapp/app.js
          WorkingDirectory=/home/ubuntu/nodeapp
          Restart=always
          User=root
          Environment=NODE_ENV=production

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd and (re)start Node.js service
      systemd:
        name: nodeapp
        daemon_reload: yes
        enabled: yes
        state: restarted

    - name: Health check
      uri:
        url: http://localhost:3000/health
        status_code: 200
      register: health
      retries: 5
      delay: 3
      until: health.status == 200
      ignore_errors: yes

    - name: Rollback if health check failed
      when: health.failed
      block:
        - name: Restore previous release
          copy:
            src: /home/ubuntu/nodeapp_backup/
            dest: /home/ubuntu/nodeapp/
            remote_src: yes
          when: existing_release.stat.exists

        - name: Restart service with previous release
          systemd:
            name: nodeapp
            state: restarted
          when: existing_release.stat.exists

        - name: Fail the play so the pipeline reports failure
          fail:
            msg: "Deployment failed health check — rolled back to previous release"
